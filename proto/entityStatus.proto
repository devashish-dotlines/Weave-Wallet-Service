syntax = "proto3";

package accounts.v1;

// Engine -> owning-service status projection. After the engine commits a
// transition (or initiates an instance) it calls SyncEntityStatus on the
// service that owns the entity, pushing the new current status so that service
// can project it onto its own entity row WITHOUT polling the engine. This keeps
// the owner's local status copy fresh even when the transition was driven
// straight against the engine (e.g. by the admin panel), not through the owner.
//
// Authenticated with the engine's service API key as `x-api-key` metadata (NOT
// the gateway JWT). Best-effort from the engine's side: the transition is
// already committed, so a sync failure is logged and never rolled back.
// Keep this file byte-identical in every consumer of the service.

service EntityStatusService {
  rpc SyncEntityStatus(SyncEntityStatusRequest) returns (SyncEntityStatusResponse);
  // Engine -> owning-service action dispatch. When a transition action rule with
  // a gRPC transport (actionType 'grpc') fires, the engine calls this instead of
  // an HTTP webhook, reusing THIS channel + `x-api-key` (no separate secret). The
  // owner runs the action identified by `action_slug` (e.g. generate an invoice)
  // and returns ok=true only when it truly succeeded — the engine then advances
  // the instance to the rule's onSuccessToStatusId. A gRPC error = retryable
  // failure (engine retries, no advance); ok=false = handled-but-not-done.
  rpc DispatchAction(DispatchActionRequest) returns (DispatchActionResponse);
  // Engine -> owning-service action discovery. Returns the gRPC actions this
  // service exposes (its action registry), so the admin panel can offer a
  // predefined "process" dropdown when building a gRPC ActionDefinition instead
  // of a free-text slug. Read-only; authenticated with the same `x-api-key`.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
}

message SyncEntityStatusRequest {
  string entity_type = 1;
  string entity_id = 2;
  string status_id = 3;
  string status_name = 4;
  string status_color = 5; // empty string = unset
  bool status_active = 6;
  bool closed = 7;
}

message SyncEntityStatusResponse {
  bool ok = 1;
}

message DispatchActionRequest {
  string action_slug = 1;  // which action the owner should run (ActionDefinition slug)
  string entity_type = 2;
  string entity_id = 3;
  string payload = 4;      // JSON string built from the action's payloadTemplate
  string instance_id = 5;
}

message DispatchActionResponse {
  bool ok = 1;         // true = action truly succeeded (engine may advance status)
  string message = 2;  // diagnostic (e.g. why ok=false)
}

message ListActionsRequest {}

message ActionInfo {
  string slug = 1;         // dispatch key (an ActionDefinition slug must match this)
  string label = 2;        // human-friendly name for the dropdown
  string description = 3;  // optional longer help text
}

message ListActionsResponse {
  repeated ActionInfo actions = 1;
}
