syntax = "proto3";

package accounting.v1;

// Inline GL posting API for the financial modules (wallet, billing, inventory,
// procurement). NOT exposed through APISix; callers authenticate with their
// service API key as `x-api-key` metadata, resolved by the auth interceptor
// before any handler runs. Every method is idempotent on `source_event`
// (FR-GL-3): a retried domain write returns the existing voucher, never a
// duplicate. Keep this file byte-identical in every consumer of the service.

service LedgerService {
  // Direct post: caller supplies balanced lines (FR-V-7 direct).
  rpc PostVoucher(PostVoucherRequest) returns (VoucherResponse);
  // Event-driven: caller supplies event_type + payload; the rule is resolved,
  // its template rendered, and a voucher posted (FR-V-7 event).
  rpc PostFromEvent(PostFromEventRequest) returns (VoucherResponse);
  // Reverse a posted voucher by id or by the original's source_event (FR-V-9/10).
  rpc ReverseVoucher(ReverseVoucherRequest) returns (VoucherResponse);
  // Active currencies with their rate to the base currency. Callers that hold
  // money in another currency convert with these before posting, because a
  // voucher itself is always in base currency.
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse);
  // Active accounts the organisation collects payments into (bank / MFS),
  // for services that tell a payer where to send money (wallet top-ups).
  rpc ListCollectionAccounts(ListCollectionAccountsRequest) returns (ListCollectionAccountsResponse);
}

message ListCollectionAccountsRequest {
  string currency_code = 1; // optional filter; empty = every currency
}

message CollectionAccountInfo {
  string code = 1;             // stable reference callers store
  string channel = 2;          // BANK | MFS | BILL_PAYMENT
  string currency_code = 3;    // ISO-4217, upper-case
  string institution_name = 4; // bank name, MFS provider (bKash, ...) or bill-payment scheme (JomPAY)
  string account_name = 5;
  string account_no = 6;       // account / wallet number; biller code for BILL_PAYMENT
  string branch = 7;           // BANK only
  string routing_no = 8;       // BANK only
  string mfs_account_type = 9; // MFS only: MERCHANT | PERSONAL | AGENT
  repeated string accepted_methods = 10; // CASH | BANK_TRANSFER | CHEQUE | MFS | BILL_PAYMENT
  string instructions = 11;    // shown to the payer
  string gl_account_code = 12; // ledger account the money lands in
  string payer_reference = 13; // fixed reference to quote (JomPAY Ref-1); empty = payer's own
}

message ListCollectionAccountsResponse {
  repeated CollectionAccountInfo accounts = 1;
}

message ListCurrenciesRequest {}

message CurrencyInfo {
  string code = 1;           // ISO-4217, upper-case
  string name = 2;
  bool is_base = 3;
  double conversion_rate = 4; // base amount ONE unit of this currency is worth (base MYR: USD = 4.0975)
  string id = 5;              // acc_currency.id — what other services store as a currency reference
  string symbol = 6;
}

message ListCurrenciesResponse {
  repeated CurrencyInfo currencies = 1;
  string base_code = 2;
}

message LineDimension {
  string dimension_id = 1;
  string value = 2;
}

message JournalLineInput {
  string account_id = 1;
  double debit = 2;
  double credit = 3;
  string narration = 4;
  int32 sort_order = 5;
  repeated LineDimension dimensions = 6;
}

message PostVoucherRequest {
  string voucher_type = 1; // JOURNAL | SALES_INVOICE | PAYMENT_RECEIPT | PAYMENT
  int64 voucher_date = 2;  // unix seconds; 0/omitted = now
  string narration = 3;
  string source_event = 4; // idempotency key (FR-V-5)
  repeated JournalLineInput lines = 5;
  string requested_by = 6;
  repeated string role_ids = 7;
}

message PostFromEventRequest {
  string event_type = 1;
  string payload_json = 2; // JSON object of substitution variables
  string voucher_type = 3;
  int64 voucher_date = 4;
  string narration = 5;
  string source_event = 6;
  string requested_by = 7;
  repeated string role_ids = 8;
}

message ReverseVoucherRequest {
  string voucher_id = 1;    // reverse by voucher id, OR
  string source_event = 2;  // reverse by the original's source_event
  string narration = 3;
  string requested_by = 4;
}

message VoucherResponse {
  string voucher_id = 1;
  string voucher_number = 2;
  repeated string warnings = 3; // e.g. unsatisfied required dimensions (FR-D-6)
}
